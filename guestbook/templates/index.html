<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гостевая книга</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .messages-list {
            margin-top: 20px;
        }

        .message-card {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .message-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .message-author {
            font-weight: bold;
            color: #764ba2;
            font-size: 1.1em;
        }

        .message-date {
            color: #999;
            font-size: 0.85em;
        }

        .message-text {
            color: #444;
            line-height: 1.5;
            margin-top: 8px;
            padding-left: 10px;
            border-left: 3px solid #764ba2;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px;
            background: #f9f9f9;
            border-radius: 12px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Гостевая книга</h1>
        <div class="subtitle">Оставьте свой след в истории</div>

        <h2>📝 Сообщения</h2>

        <div class="messages-list">
            {% if messages %}
                {% for msg in messages %}
                <div class="message-card">
                    <div class="message-header">
                        <span class="message-author">✍️ {{ msg['name'] }}</span>
                        <span class="message-date">📅 {{ msg['created_at'] }}</span>
                    </div>
                    <div class="message-text">
                        {{ msg['message'] }}
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="empty-message">
                    😔 Пока нет сообщений. Будьте первым!
                </div>
            {% endif %}
        </div>

        <footer>
            <p>Гостевая книга | Проект для изучения Flask и SQLite</p>
        </footer>
    </div>
</body>
</html>
