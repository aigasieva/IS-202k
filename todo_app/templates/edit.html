<!DOCTYPE html>
<html>
<head>
    <title>Редактировать задачу</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 40px;
        }
        h1 {
            color: blue;
        }
        input, button {
            padding: 8px;
            margin: 5px;
        }
        input {
            width: 300px;
        }
        .message {
            color: red;
            background-color: #ffcccc;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success {
            color: green;
            background-color: #ccffcc;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        button {
            background-color: green;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        a {
            text-decoration: none;
            background-color: #666;
            color: white;
            padding: 8px 15px;
            border-radius: 3px;
            margin-left: 5px;
        }
        a:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <h1>✏️ Редактирование задачи</h1>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}

    {% if success %}
        <p class="success">{{ success }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="task" value="{{ task.text }}" required>
        <button type="submit">💾 Сохранить</button>
        <a href="/">❌ Отмена</a>
    </form>
</body>
</html>
