<!DOCTYPE html>
<html>
<head>
    <title>Список дел</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 40px;
        }
        h1 {
            color: blue;
        }
        .done {
            text-decoration: line-through;
            color: gray;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            background: white;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-text {
            flex-grow: 1;
        }
        .task-date {
            font-size: 12px;
            color: gray;
            margin-right: 15px;
        }
        a {
            text-decoration: none;
            background-color: #ff4444;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            margin-left: 5px;
        }
        a:hover {
            background-color: #cc0000;
        }
        .clear-btn {
            background-color: #ff9900;
            margin-top: 20px;
            display: inline-block;
        }
        .clear-btn:hover {
            background-color: #cc7700;
        }
        form {
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 8px;
            width: 300px;
        }
        button {
            padding: 8px 15px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>📋 Мои задачи</h1>

    <ul>
        {% for task in tasks %}
        <li>
            <span class="task-text">{{ task.text }}</span>
            <span class="task-date">{{ task.date }}</span>
            <a href="/delete/{{ loop.index0 }}">🗑 Удалить</a>
        </li>
        {% endfor %}
    </ul>

    {% if tasks|length == 0 %}
        <p>✨ Нет задач. Добавьте первую!</p>
    {% endif %}

    <a href="/clear" class="clear-btn" style="background-color:#ff9900; padding:8px 15px; border-radius:5px; color:white; display:inline-block;">🧹 Очистить всё</a>

    <h2>➕ Добавить задачу</h2>
    <form method="POST" action="/add">
        <input type="text" name="task" placeholder="Новая задача" required>
        <button type="submit">Добавить</button>
    </form>
</body>
</html>
